<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>keyward</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <img src="favicon.svg" alt="" width="20" height="20" />
        <span>keyward</span>
      </div>
      <nav class="tabs" aria-label="Views">
        <button type="button" class="tab" data-tab="keys" aria-current="page">Keys</button>
        <button type="button" class="tab" data-tab="spend">Spend <span class="tab-alert" id="spend-dot" hidden aria-label="a key is spiking"></span></button>
      </nav>
      <div class="bar-actions">
        <label class="check" title="Shell history and config, app configs, AI chat transcripts">
          <input type="checkbox" id="home" />
          <span>Include home folder</span>
        </label>
        <button id="rescan" type="button" class="btn">Rescan</button>
      </div>
      <div class="progress-line" id="progress-line" hidden></div>
    </header>

    <main id="keys" class="page">
      <section class="verdict" aria-live="polite">
        <h1 id="verdict-title">Looking for keys…</h1>
        <p id="verdict-sub" class="verdict-sub"></p>
      </section>

      <section id="error" class="error" role="alert" hidden></section>

      <section id="reach" class="reach-bar" hidden aria-label="Filter by reach"></section>

      <section id="controls" class="controls" hidden>
        <input id="search" type="search" placeholder="Search providers, files, variables" autocomplete="off" aria-label="Search keys" />
        <div class="chips" id="chips" aria-label="Filter by where keys were found"></div>
      </section>

      <section id="list" class="list" aria-label="Keys"></section>
    </main>

    <main id="spend" class="page" hidden></main>

    <footer class="foot">
      <p>
        keyward runs on this machine and keeps nothing. This page only ever receives masked keys. It goes online
        only when you check, rotate or freeze a key, and then only to that key's provider or your hosting platform.
      </p>
    </footer>
    <script src="app.js" type="module"></script>
  </body>
</html>
